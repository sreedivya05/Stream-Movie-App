<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login — Xtream</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="header">
    <h1 class="brand">Xtream</h1>
    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="movies.html">Trending</a>
      <a href="about.html">About</a>
      <a href="signup.html">Sign up</a>
      <a href="login.html">Login</a>
    </nav>
  </header>

  <main class="container">
    <div class="form-card" style="max-width: 380px;">
      <h2 style="margin-bottom:15px;">Login</h2>

      <form>
        <label>
          Email or Username
          <input type="text" name="user" required />
        </label>

        <label>
          Password
          <input type="password" name="pw" required />
        </label>

        <div style="margin-top:10px;">
          <button type="submit" class="button">Login</button>
        </div>
      </form>

      <p style="margin-top:12px;font-size:14px;">
        Don't have an account? <a href="signup.html" style="color:#ffb3c6;">Sign up</a>
      </p>
    </div>
  </main>

  <footer class="footer">
    <small>Demo login — no real authentication implemented.</small>
  </footer>
</body>
</html>
